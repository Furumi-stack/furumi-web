<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('downloadManager', () => ({
        get manager() { return Alpine.store('torrents'); },
        sections: [
            {id:'files', label:'{{ t.player_files }}'},
            {% if torrent_downloads_enabled %}{id:'torrents', label:'{{ t.player_torrents }}'},{% endif %}
            {% if youtube_downloads_enabled %}{id:'youtube', label:'{{ t.player_youtube }}'},{% endif %}
            {id:'history', label:'{{ t.player_download_history_tab }}'},
        ],
        checked: new Map(),
        confirming: false,
        removing: false,
        removalError: '',
        sourceLabel(id) {
            return {files:'{{ t.player_files }}', torrents:'{{ t.player_torrents }}', youtube:'{{ t.player_youtube }}'}[id];
        },
        fileCount(n) {
            const forms = {one:'{{ t.player_download_file_one }}', few:'{{ t.player_download_file_few }}', other:'{{ t.player_files_count }}'};
            return n + ' ' + (forms[artistPluralRules.select(n)] || forms.other);
        },
        titleFor(row) { return row.title || (row.item_count ? this.fileCount(row.item_count) : this.sourceLabel(row.source)); },
        metaFor(row) {
            const parts = [this.sourceLabel(row.source)];
            if (row.title && row.item_count > 1) parts.push(this.fileCount(row.item_count));
            if (row.created_at) parts.push(this.manager.formatUploadDate(row.created_at));
            return parts.join(' · ');
        },
        tone(row) {
            if (['complete','completed','skipped'].includes(row.status)) return 'success';
            if (['failed','ai_failed','needs_review','complete_with_errors'].includes(row.status)) return 'attention';
            return 'normal';
        },
        statusFor(row) {
            const transfer = row.source === 'torrents' && ['preview','moving','paused','completed'].includes(row.status);
            const label = transfer ? this.manager.statusLabel(row) : this.manager.youtubeStatusLabel(row.status);
            return row.status === 'downloading' && row.progress_percent != null ? label + ' · ' + Math.round(row.progress_percent) + '%' : label;
        },
        select(id) {
            if (this.removing) return;
            this.confirming = false;
            this.manager.showSourceTab(id);
            this.$nextTick(() => document.getElementById('downloads-tab-' + id)?.focus({preventScroll:true}));
        },
        navigate(event) {
            const index = this.sections.findIndex(s => s.id === this.manager.sourceTab);
            const count = this.sections.length;
            const next = {ArrowLeft:(index+count-1)%count, ArrowRight:(index+1)%count, Home:0, End:count-1}[event.key];
            if (next === undefined) return;
            event.preventDefault();
            this.select(this.sections[next].id);
        },
        canOpen(row) {
            return row.source === 'torrents' && this.manager.torrentDownloadsEnabled || row.source === 'youtube' && this.manager.youtubeDownloadsEnabled;
        },
        openTransfer(row) {
            if (row.source === 'torrents') {
                this.select('torrents');
                this.manager.openSession(row.id);
            } else {
                this.manager.openYoutubeJob(row);
            }
        },
        key(row) { return row.source + ':' + row.id; },
        mark(rows, value) {
            for (const row of rows) {
                if (value) this.checked.set(this.key(row), {source:row.source, id:row.id});
                else this.checked.delete(this.key(row));
            }
        },
        get checkedOnPage() { return this.manager.downloadHistory.filter(row => this.checked.has(this.key(row))).length; },
        stopConfirmation() {
            this.confirming = false;
            this.$nextTick(() => this.$refs.remove?.focus());
        },
        async forget() {
            if (this.removing || !this.checked.size) return;
            this.removing = true;
            this.removalError = '';
            try {
                const res = await fetch('/api/player/downloads/history/hide', {
                    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({items:[...this.checked.values()]})
                });
                if (!res.ok) throw new Error();
                const m = this.manager;
                m.downloadHistory = m.downloadHistory.filter(row => !this.checked.has(this.key(row)));
                if (m.latestDownload && this.checked.has(this.key(m.latestDownload))) m.latestDownload = null;
                if (m.youtubeDetail && this.checked.has('youtube:' + m.youtubeDetail.id)) m.youtubeDetail = null;
                if (m.previewData && this.checked.has('torrents:' + m.previewData.id)) m.addNew();
                this.checked.clear();
                this.confirming = false;
                await m.refreshDownloads();
                this.$nextTick(() => this.$refs.all?.focus({preventScroll:true}));
            } catch {
                this.removalError = '{{ t.player_download_forget_error }}';
            } finally {
                this.removing = false;
            }
        },
        cancel() {
            if (this.confirming && !this.removing) this.stopConfirmation();
            else this.dismiss();
        },
        dismiss() {
            finishPlayerDialog(this.$root, () => {
                this.manager.close();
                this.$nextTick(() => document.querySelector('.torrent-import-btn')?.focus({preventScroll:true}));
            });
        },
    }));
});
</script>
