<template x-if="manager.sourceTab === 'youtube'">
<section id="downloads-youtube" class="download-source-pane" role="tabpanel" aria-labelledby="downloads-tab-youtube">
    <template x-if="manager.youtubeDetail">
        <div class="download-source-detail">
            <div class="download-preview-title">
                <h4 x-text="manager.youtubeDetail.title"></h4>
                <span class="torrent-status-badge" :class="manager.youtubeStatusClass(manager.youtubeDetail.status)" x-text="manager.youtubeStatusLabel(manager.youtubeDetail.status)"></span>
            </div>
            <p x-show="manager.youtubeDetail.error" x-text="manager.youtubeDetail.error" class="download-source-error"></p>
            <div class="download-selection-actions">
                <button type="button" class="download-button" x-show="manager.youtubeJobCancellable(manager.youtubeDetail.status)" :disabled="manager.youtubeActionBusy"
                        @click="manager.cancelYoutubeJob(manager.youtubeDetail.id)">{{ t.player_youtube_stop }}</button>
                <button type="button" class="download-button" x-show="['failed','complete_with_errors'].includes(manager.youtubeDetail.status)" :disabled="manager.youtubeActionBusy"
                        @click="manager.retryYoutubeJob(manager.youtubeDetail.id)">{{ t.player_retry_failed }}</button>
                <button type="button" class="download-button" @click="manager.youtubeDetail=null; $nextTick(() => $refs.urlInput.focus())">{{ t.player_download_another }}</button>
            </div>
        </div>
    </template>
    <form x-show="!manager.youtubeDetail" class="download-link-form" @submit.prevent="$store.torrents.previewYoutubeUrl()">
        <label for="youtube-download-url">{{ t.player_youtube_url }}</label>
        <div class="download-link-controls">
            <input x-ref="urlInput" class="download-field" id="youtube-download-url" type="text" inputmode="url" autocomplete="url"
                   spellcheck="false" x-model="$store.torrents.youtubeUrl" @input="$store.torrents.clearYoutubePreview()"
                   placeholder="https://youtu.be/…" :readonly="$store.torrents.youtubeSubmitting">
            <button class="download-button primary" type="submit"
                    :disabled="$store.torrents.youtubePreviewLoading || $store.torrents.youtubeSubmitting || !$store.torrents.youtubeUrl.trim()">
                {{ t.player_youtube_parse }}
            </button>
        </div>
    </form>
    <template x-if="!manager.youtubeDetail && manager.youtubePreviewLoading">
        <div class="page-skeleton" aria-label="{{ t.player_youtube_parsing }}" aria-busy="true">{% include "player/skeleton_tracks.html" %}</div>
    </template>
    <template x-if="!manager.youtubeDetail && manager.youtubePreview">
        <div class="download-video-preview" x-data="{choosing:false, visited:false}">
            <div class="download-preview-title">
                <h4 x-text="$store.torrents.youtubePreview.title"></h4>
                <span x-text="$store.torrents.youtubePreviewSelectedCount() + ' / ' + $store.torrents.youtubePreview.items.length"></span>
            </div>
            <button type="button" class="download-button download-choose-videos" x-show="manager.youtubePreview.items.length > 1 || !manager.youtubePreviewSelectedCount() || choosing"
                    :aria-expanded="choosing" aria-controls="download-video-picker" @click="visited=true; choosing=!choosing">{{ t.player_youtube_preview_title }}</button>
            <div id="download-video-picker" x-show="choosing" x-transition.opacity.duration.130ms>
                <template x-if="visited"><div class="download-video-picker">
                <label class="download-video-all">
                    <input type="checkbox" :disabled="$store.torrents.youtubeSubmitting"
                           :checked="$store.torrents.youtubePreviewSelectedCount() === $store.torrents.youtubePreview.items.length"
                           x-effect="$el.indeterminate = $store.torrents.youtubePreviewSelectedCount() > 0 && $store.torrents.youtubePreviewSelectedCount() < $store.torrents.youtubePreview.items.length"
                           @change="$el.checked ? $store.torrents.selectAllYoutubePreview() : $store.torrents.clearYoutubePreviewSelection()">
                    <span>{{ t.player_youtube_select_all }}</span>
                </label>
                <div class="download-video-list" role="group" aria-label="{{ t.player_youtube_preview_title }}">
                    <template x-for="item in $store.torrents.youtubePreview.items" :key="item.source_id">
                        <label class="download-video-row">
                            <input type="checkbox" :disabled="$store.torrents.youtubeSubmitting"
                                   :checked="$store.torrents.youtubePreviewIsSelected(item.source_id)"
                                   @change="$store.torrents.toggleYoutubePreviewItem(item.source_id)">
                            <span class="download-video-index" x-text="item.playlist_index"></span>
                            <span x-text="item.title"></span>
                        </label>
                    </template>
                </div>
            </div>
                </template>
            </div>
            {% let kind = "youtube" %}
            {% include "player/download_destination.html" %}
            <div class="download-selection-actions">
                <button type="button" class="download-button" :disabled="$store.torrents.youtubeSubmitting"
                        @click="$store.torrents.clearYoutubePreview()">{{ t.player_cancel }}</button>
                <button type="button" class="download-button primary" @click="$store.torrents.startYoutubeDownload()"
                        :disabled="$store.torrents.youtubeSubmitting || !$store.torrents.youtubePreviewSelectedCount() || !$store.torrents.youtubeDestinationValid()">{{ t.player_youtube_start_import }}</button>
            </div>
        </div>
    </template>
</section>
</template>
