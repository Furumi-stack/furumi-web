<button class="search-version-toggle" type="button" x-show="!track._searchGroupChild && track._searchGroupCount > 1"
        @click.stop="versionGroups.toggle(track)" @dblclick.stop
        :aria-expanded="track._searchGroupExpanded" :aria-controls="track._searchGroupControls"
        :title="versionGroups.label(track)" :aria-label="versionGroups.label(track)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3v12M18 9a9 9 0 0 1-9 9"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/></svg>
    <span x-text="track._searchGroupCount"></span>
</button>
