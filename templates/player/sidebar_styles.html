<style>
{% if !guest %}{% include "player/wordmark_font.css" %}{% endif %}
.sidebar-brand { display: flex; align-items: baseline; gap: 8px; flex: none; padding: 18px 22px 0; line-height: 1; }
.sidebar-build-version { color: #888; font-size: 11px; white-space: nowrap; text-decoration: none; }
.sidebar-build-version:is(:hover, :focus-visible) { color: var(--text-secondary); text-decoration: underline; }
.sidebar-wordmark {
    display: inline-block; padding: 0; border: 0; border-radius: 3px; background: transparent;
    color: #e7e7e7; font: 700 23px/1.2 "Furumi Wordmark", ui-monospace, monospace;
    letter-spacing: -.055em; transform-origin: 50% 60%; cursor: pointer; user-select: none;
}
.sidebar-wordmark span { color: var(--accent); }
.sidebar-wordmark, .sidebar-wordmark span { transition: color 115ms ease-out; }
.sidebar-wordmark:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
@media (hover: hover) {
    .sidebar-wordmark:hover { color: #f1f1f1; }
    .sidebar-wordmark:hover span { color: color-mix(in srgb, var(--accent), var(--accent-hover) 65%); }
}
@media (prefers-reduced-motion: reduce) {
    .sidebar-wordmark, .sidebar-wordmark span { transition: none; }
}
.music-nav {
    flex: 1;
    min-height: 0;
    padding: 18px 12px;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
}
.music-nav a, .account-action-list a { text-decoration: none; }
.music-nav-pages { display: grid; gap: 3px; }
.music-nav-pages a, .music-shortcut, .account-action-list > *, .sidebar-account-trigger {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 12px;
    border: 0;
    border-radius: 7px;
    color: var(--text-secondary);
    background: transparent;
    font: inherit;
    text-align: left;
    cursor: pointer;
}
.music-nav-pages a { min-height: 41px; padding: 8px 11px; font-size: 14px; font-weight: 600; }
.music-nav svg, .sidebar-account-trigger svg, .account-action-list svg {
    flex: 0 0 auto;
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}
.music-nav-pages a:hover, .music-shortcut:hover, .account-action-list > :hover,
.sidebar-account-trigger:hover, .sidebar-account-trigger[aria-expanded="true"] {
    background: var(--bg-hover);
    color: var(--text-primary);
}
.music-nav a[aria-current], .account-action-list a[aria-current] { background: var(--bg-active); color: var(--text-primary); }
.music-nav-pages a[aria-current] svg, .account-action-list a[aria-current] svg { color: var(--accent); }
.music-nav :is(a, button):focus-visible, .sidebar-account button:focus-visible, .account-action-list > :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
}
.music-shortcuts {
    margin-top: 17px;
    padding-top: 16px;
    border-top: 1px solid var(--border-color);
}
.music-shortcuts h2 { margin: 0 10px 6px; font-size: 12px; font-weight: 600; color: var(--text-subdued); }
.music-shortcut { padding: 6px 8px; min-height: 43px; gap: 10px; }
.music-shortcut-art {
    position: relative;
    overflow: hidden;
    display: grid;
    place-items: center;
    flex: 0 0 31px;
    height: 31px;
    border-radius: 5px;
    background: var(--bg-elevated);
    color: var(--text-subdued);
}
.shortcut-artist { border-radius: 50%; }
.shortcut-likes { background: rgba(29,185,84,.13); color: var(--accent); }
.shortcut-likes svg { width: 15px; fill: currentColor; stroke: none; }
.music-shortcut-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.music-shortcut-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
.music-shortcut-count { margin-left: auto; font-size: 12px; color: var(--text-subdued); font-variant-numeric: tabular-nums; }
.shortcut-suggestions-label { margin: 12px 10px 3px; color: var(--text-subdued); font-size: 11px; font-weight: 600; }
.shortcut-pin-list { position: relative; list-style: none; margin: 0; padding: 0; }
.shortcut-pin-row { position: relative; display: flex; align-items: center; min-width: 0; border-radius: 7px; }
.shortcut-pin-row > a { flex: 1; }
.shortcut-pin-row[data-pin-href]:is(:hover,:focus-within) { background: var(--bg-hover); }
.shortcut-pin-row:has(> a[aria-current]) { background: var(--bg-active); }
.shortcut-pin-row.is-dragging { background: var(--bg-active); }
.shortcut-pin-row.is-dragging .shortcut-pin-grip { color: var(--accent); cursor: grabbing; }
.shortcut-pin-row.is-drop-before::before, .shortcut-pin-list.drop-at-end::after {
    content: ''; position: absolute; left: 6px; right: 6px; height: 2px;
    border-radius: 2px; background: var(--accent); z-index: 1; pointer-events: none;
}
.shortcut-pin-row.is-drop-before::before { top: -1px; }
.shortcut-pin-list.drop-at-end::after { bottom: -1px; }
.shortcut-pin-actions { display: flex; align-items: center; padding-right: 2px; }
.shortcut-pin-actions button {
    display: grid; place-items: center; flex: none; width: 28px; height: 34px; padding: 0;
    border: 0; border-radius: 5px; background: transparent; color: var(--text-subdued); cursor: pointer;
}
.shortcut-pin-actions button:is(:hover,:focus-visible) { color: var(--text-primary); background: var(--bg-active); }
.shortcut-pin-actions svg { width: 15px; height: 15px; pointer-events: none; }
.shortcut-pin-actions .shortcut-pin-grip { touch-action: none; user-select: none; cursor: grab; }
.mobile-library-drawer .shortcut-pin-actions button { width: 44px; height: 44px; }
.sidebar-account { position: relative; flex: 0 0 auto; padding: 8px; border-top: 1px solid var(--border-color); }
.sidebar-account-trigger { width: 100%; padding: 7px 10px; }
.sidebar-account-trigger .user-avatar { width: 29px; height: 29px; flex-shrink: 0; font-size: 12px; }
.sidebar-account-trigger .user-name { flex: 1; font-weight: 600; }
.sidebar-account-trigger svg { width: 15px; height: 15px; }
.sidebar-account-popover, .mobile-account-control .mobile-account-popover {
    position: absolute;
    z-index: 65;
    padding: 5px;
    border: 1px solid var(--border-color);
    border-radius: 9px;
    background: var(--bg-elevated);
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.sidebar-account-popover { left: 8px; right: 8px; bottom: calc(100% + 3px); }
.account-action-list > * { width: 100%; min-height: 38px; padding: 8px 10px; font-size: 13px; }
.account-action-list svg { width: 17px; height: 17px; }
.account-menu-name { overflow-wrap: anywhere; padding: 9px 10px; margin-bottom: 3px; font-size: 14px; font-weight: 650; border-bottom: 1px solid var(--border-color); }
.mobile-account-control { display: none; position: relative; flex: 0 0 auto; }
.mobile-account-control .mobile-account-chip { width: 42px; padding: 0; justify-content: center; }
.mobile-account-control .mobile-account-popover { top: calc(100% + 6px); right: 0; width: min(240px, calc(100vw - 24px)); }
.sidebar-account-popover, .mobile-account-control .mobile-account-popover {max-height:calc(100dvh - var(--player-bar-space) - 72px);overflow-y:auto;overscroll-behavior:contain}
.account-popover[inert] { visibility: hidden; }
@media (prefers-reduced-motion: no-preference) {
    .account-popover {
        /* Leave room for the shadow when the panel is fully open. */
        clip-path: inset(-32px);
        opacity: 1;
        transition: clip-path 150ms ease-out, opacity 120ms ease-out;
    }
    .account-popover[inert] {
        clip-path: inset(100% -32px 0);
        opacity: 0;
        transition: clip-path 110ms ease-in, opacity 110ms ease-in, visibility 0s 110ms;
    }
    .mobile-account-popover[inert] { clip-path: inset(0 -32px 100%); }
}
.mobile-library-backdrop { color: var(--text-primary); padding: 0; border: 0; margin: 0; width: 100%; height: 100%; max-width: none; max-height: none; }
.mobile-library-backdrop::backdrop { background: transparent; }
.mobile-library-drawer .music-nav { padding: 4px 2px; overflow: visible; }
.mobile-library-drawer .music-nav-pages a, .mobile-library-drawer .music-shortcut { min-height: 44px; }
@media (max-width: 900px), (pointer: coarse) and (max-width: 1024px) {
    .mobile-account-control { display: block; }
    .account-action-list > * { min-height: 44px; }
}
{% include "player/settings_styles.css" %}
{% include "player/settings_devices.css" %}
{% include "player/offline_styles.css" %}
{% include "player/offline_cache_styles.css" %}
</style>
