<header class="collection-heading">
    <h1 class="section-title">{{ t.player_global_library }}</h1>
    <button data-online-only data-member-only type="button" class="release-action-btn secondary" x-show="$store.library.view === 'playlists'"
            @click="$store.playlists.showCreate()"><span aria-hidden="true">＋</span> {{ t.player_new_playlist }}</button>
</header>
<nav class="collection-tabs" aria-label="{{ t.player_global_library }}">
    <a href="#artists" :aria-current="$store.library.view === 'artists' ? 'page' : null">{{ t.player_all_music }}</a>
    <a href="#artists?tab=playlists" :aria-current="$store.library.view === 'playlists' ? 'page' : null">{{ t.player_playlists }}</a>
    <a data-member-only href="#uploads" :aria-current="$store.library.view === 'my_uploads' ? 'page' : null">{{ t.player_my_uploads }}</a>
</nav>
