<nav class="music-nav" aria-label="{{ t.player_library }}">
    <div class="music-nav-pages">
        <a href="#artists" :aria-current="['artists','published'].includes($store.library.view) ? 'page' : null">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            {{ t.player_global_library }}
        </a>
        <a href="#collection" :aria-current="['collection','my_uploads'].includes($store.library.view) ? 'page' : null">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16M9 4v16M14 5l5 14"/><path d="m13 5 3-1 5 15-3 1z"/></svg>
            {{ t.player_my_music }}
        </a>
        <a href="#podcasts" class="podcast-nav" :aria-current="['podcasts','podcast_detail'].includes($store.library.view) ? 'page' : null">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>
            <span x-text="$store.podcasts.text('podcasts')"></span>
        </a>
        <a href="#listening" :aria-current="$store.library.view === 'listening' ? 'page' : null">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V12M9 20V6M14 20V3M19 20V9"/></svg>
            {{ t.player_my_listening }}
        </a>
    </div>
    <section class="music-shortcuts"
             x-data="{ get shortcuts() {
                 if (this.$store.pins.items.length || this.$store.pins.undoNotices.length) return this.$store.pins.items;
                 return this.$store.playlists.regularList().filter(p => p.kind === 'user' && p.is_own).slice(0, 3)
                     .map(p => ({ href: '#playlist/' + p.id, title: p.title, cover_url: p.cover_url, kind: 'playlist' }));
             } }">
        <h2>{{ t.player_quick_access }}</h2>
        <a class="music-shortcut" href="#playlist/-1"
           :aria-current="$store.library._activeHash === '#playlist/-1' ? 'page' : null">
            <span class="music-shortcut-art shortcut-likes">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.7 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.7 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg>
            </span>
            <span class="music-shortcut-title">{{ t.player_likes_playlist }}</span>
            <span class="music-shortcut-count" x-text="$store.playlists.list.find(p => p.kind === 'likes')?.track_count ?? ''"></span>
        </a>
        <h3 class="shortcut-suggestions-label" x-show="!$store.pins.items.length && shortcuts.length" x-cloak>{{ t.player_my_playlists }}</h3>
        <ol class="shortcut-pin-list" :class="{ 'drop-at-end': $store.pins.dragHref && $store.pins.dropBeforeHref === null }">
            <template x-for="item in shortcuts" :key="item.href">
                <li class="shortcut-pin-row" :data-pin-href="$store.pins.items.length ? item.href : null"
                    :class="{ 'is-dragging': $store.pins.dragHref === item.href, 'is-drop-before': $store.pins.dropBeforeHref === item.href }">
                    <a class="music-shortcut" :href="item.href" :title="item.title" :aria-current="$store.library._activeHash === item.href ? 'page' : null">
                        <span class="music-shortcut-art" :class="{ 'shortcut-artist': item.kind === 'artist' }">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path x-show="item.kind === 'playlist'" d="M3 6h13M3 11h9M3 16h5m8-3v7l5-3.5z"/>
                                <g x-show="item.kind === 'artist'"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></g>
                                <g x-show="item.kind === 'release'"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/></g>
                            </svg>
                            <template x-if="item.cover_url"><img :src="item.cover_url" alt="" loading="lazy" @error="$el.hidden = true" @load="$el.hidden = false"></template>
                        </span>
                        <span class="music-shortcut-title" x-text="item.title"></span>
                    </a>
                    <template x-if="$store.pins.items.length">
                        <div class="shortcut-pin-actions" @keydown.space.stop>
                            <button type="button" class="shortcut-pin-grip" x-show="$store.pins.items.length > 1"
                                    :aria-label="'{{ t.player_reorder_pin }} · ' + item.title"
                                    title="{{ t.player_reorder_hint }}" aria-description="{{ t.player_reorder_hint }}"
                                    aria-keyshortcuts="ArrowUp ArrowDown"
                                    @pointerdown="$store.pins.startDrag($event, item)"
                                    @keydown.arrow-up.stop.prevent="$store.pins.moveBy(item, -1, $el)"
                                    @keydown.arrow-down.stop.prevent="$store.pins.moveBy(item, 1, $el)">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke-width="3.8"/></svg>
                            </button>
                            <button type="button" class="shortcut-unpin"
                                    :aria-label="'{{ t.player_sidebar_unpin }} · ' + item.title" title="{{ t.player_sidebar_unpin }}"
                                    @click.stop="$store.pins.unpin(item, $event)">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M8.3 8.3l-2.8 3-2 1.1 8.1 8.1 1.1-2 3-2.8M17.5 12.7l1.1-1.1 2.1-.7-7.6-7.6-.7 2.1-1 1M8.4 15.6 4 20"/></svg>
                            </button>
                        </div>
                    </template>
                </li>
            </template>
        </ol>
    </section>
</nav>
