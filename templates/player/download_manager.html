<template x-if="$store.torrents.modal">
    <dialog class="player-dialog downloads-dialog" x-data="downloadManager" aria-labelledby="downloads-title"
            x-init="$nextTick(() => { if ($el.isConnected) { $el.showModal(); document.getElementById('downloads-title').focus({preventScroll:true}) } })"
            x-effect="if ($store.offline.active) manager.close()" @cancel.prevent="cancel()"
            @dismiss-player-dialog.stop="dismiss()" @click.self="dismiss()" @keydown.stop>
        <svg aria-hidden="true" width="0" height="0" style="position:absolute">
            <symbol id="download-symbol-history" viewBox="0 0 24 24"><path d="M3 5v5h5M3.5 10a8.5 8.5 0 1 1 1 7M12 7v5l3 2"/></symbol>
            <symbol id="download-symbol-youtube" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></symbol>
            <symbol id="download-symbol-torrents" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="m10.6 7.1-4.2 8.6m7-8.6 4.2 8.6M7.5 18h9"/></symbol>
            <symbol id="download-symbol-files" viewBox="0 0 24 24"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
        </svg>
        <div class="player-dialog-surface downloads-shell">
            {% let dialog_head_class = "downloads-head" %}
            {% let dialog_title_id = "downloads-title" %}
            {% let dialog_title = t.player_download_music %}
            {% let dialog_icon = "M12 3v11m-4-4 4 4 4-4M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" %}
            {% let show_version = false %}
            {% include "player/dialog_header.html" %}
            <nav class="downloads-nav" role="tablist" aria-label="{{ t.player_download_title }}" @keydown="navigate($event)">
                <template x-for="section in sections" :key="section.id">
                    <button type="button" role="tab" :id="'downloads-tab-' + section.id" :aria-controls="'downloads-' + section.id"
                            :aria-selected="manager.sourceTab === section.id" :tabindex="manager.sourceTab === section.id ? 0 : -1" @click="select(section.id)">
                        <svg aria-hidden="true"><use :href="'#download-symbol-' + section.id"/></svg>
                        <span x-text="section.label"></span>
                    </button>
                </template>
            </nav>
            <div class="downloads-notice" role="status" x-show="manager.message" :class="{error:manager.error}" x-cloak>
                <span x-text="manager.message"></span>
                <button type="button" class="download-icon-button" aria-label="{{ t.player_close }}" @click="manager._setMessage('')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
            </div>
            <div class="downloads-content">
                {% include "player/download_files.html" %}
                {% if torrent_downloads_enabled %}{% include "player/download_torrent.html" %}{% endif %}
                {% if youtube_downloads_enabled %}{% include "player/download_youtube.html" %}{% endif %}
                {% include "player/download_history.html" %}
            </div>
            <template x-if="manager.latestDownload && manager.sourceTab !== 'history' && !(manager.sourceTab === 'torrents' && manager.workspaceMode === 'session') && !(manager.sourceTab === 'youtube' && manager.youtubeDetail)">
                <button type="button" class="downloads-latest" @click="select('history')">
                    <span>{{ t.player_download_latest }}</span>
                    <strong x-text="titleFor(manager.latestDownload)"></strong>
                    <small :data-tone="tone(manager.latestDownload)" x-text="statusFor(manager.latestDownload)"></small>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                </button>
            </template>
            <footer class="downloads-stats" id="downloads-stats" x-show="manager.downloadStats" x-cloak>
                <span>{{ t.player_my_uploads }}</span>
                <strong x-text="manager.downloadStats ? formatArtistCount(manager.downloadStats.tracks,'tracks') + ' / ' + formatArtistCount(manager.downloadStats.releases,'releases') : ''"></strong>
            </footer>
        </div>
    </dialog>
</template>
