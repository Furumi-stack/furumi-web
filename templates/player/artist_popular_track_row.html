<div class="search-result-entry" :id="track._searchRowId"
     :class="{'search-result-variant':track._searchGroupChild, 'search-result-hidden':track._searchGroupHidden}"
     :aria-hidden="track._searchGroupHidden" :inert="track._searchGroupHidden ? true : null">
    <div class="search-result-clip">
        <div class="track-row artist-appearance-row"
             :class="{ 'search-track-variant':track._searchGroupChild, playing:$store.player.currentTrack?.id === track.id }"
             tabindex="0" @dblclick="play(track)" @keydown.enter.self.prevent="play(track)">
            <span class="track-num" x-text="track._searchGroupChild ? '↳' : track._searchGroupNumber"></span>
            <div class="track-info">
                <button class="artist-appearance-cover"
                        type="button"
                        @click.stop="$store.library.openRelease(track.release_id)" @dblclick.stop
                        :title="track.release_title"
                        aria-label="{{ t.player_release }}">
                    <template x-if="track.cover_url">
                        <img x-artwork="track.cover_url" alt="" aria-hidden="true" loading="lazy">
                    </template>
                    <template x-if="!track.cover_url">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="4"/></svg>
                    </template>
                </button>
                <div class="artist-appearance-copy">
                    <div class="track-title search-track-title">
                        {% include "player/track_version_toggle.html" %}
                        <span class="search-track-name">
                            <span x-text="track.title"></span>
                            <span style="color:var(--text-subdued)"> · </span>
                            <a class="artist-link" :href="$store.library.releaseHref($store.library.trackRelease(track))" @click.stop @dblclick.stop x-text="track.release_title"></a>
                        </span>
                    </div>
                    <div class="track-artists-inline">
                        {% include "player/track_artist_links.html" %}
                    </div>
                </div>
            </div>
            <span></span>
            <div class="track-actions">
                {% include "player/track_row_badges.html" %}
                <button data-online-only data-member-only class="like-btn" :class="{ liked: $store.likes.has(track.id) }" @click.stop="$store.likes.toggle(track.id)" title="{{ t.player_like }}">
                    <svg viewBox="0 0 24 24" :fill="$store.likes.has(track.id) ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>
                </button>
                <button class="track-action-btn queue-insert-btn queue-next-btn" @click.stop="$store.queue.addNextInQueue([track])" title="{{ t.player_play_next }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h10M5 12h7M5 18h10"/><path d="M17 9l4 3-4 3" fill="currentColor" stroke="none"/></svg>
                </button>
                {% include "player/track_actions_button.html" %}
            </div>
            <span class="track-duration" x-text="formatTime(track.duration_seconds)"></span>
        </div>
    </div>
</div>
