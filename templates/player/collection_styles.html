<style>
.collection-heading,.collection-tabs,.collection-row,.collection-link {display:flex;align-items:center}
.collection-heading {justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.collection-heading .section-title {margin:0}
.collection-tabs {gap:6px;flex-wrap:wrap;margin:0 0 22px}
.collection-tabs a {display:inline-flex;align-items:center;min-height:32px;color:var(--text-secondary);border-radius:18px;padding:6px 12px;background:var(--bg-elevated);text-decoration:none;font-size:13px}
.collection-tabs a:hover,.collection-tabs a:focus-visible {color:var(--text-primary)}
.collection-tabs a[aria-current] {background:var(--text-primary);color:var(--bg-primary)}
@media (max-width:420px) {
    .collection-tabs {gap:4px}
    .collection-tabs a {min-height:36px;padding-inline:9px}
}
.collection-list {max-width:840px}
.collection-row {gap:8px;border-bottom:1px solid var(--border-color);padding:4px 6px}
.collection-row:hover,.collection-row:focus-within {background:var(--bg-elevated);border-radius:6px}
.collection-link {gap:12px;min-width:0;flex:1;color:inherit;text-decoration:none;padding:5px 0}
.collection-link > span:last-child {min-width:0}
.collection-link strong,.collection-link small {display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.collection-link strong {font-size:14px;font-weight:600}
.collection-link small {color:var(--text-subdued);font-size:12px;margin-top:3px}
.collection-art {position:relative;display:grid;place-items:center;flex:none;width:44px;height:44px;background:var(--bg-active);color:var(--text-subdued);border-radius:5px;overflow:hidden}
.collection-art.artist {border-radius:50%}
.collection-art.likes {color:var(--accent);background:#183426}
.collection-art img {position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.playlist-art-tiles {display:grid;position:absolute;inset:0;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:1px;overflow:hidden}
.playlist-art-tiles[data-tiles="1"] {grid-template-columns:minmax(0,1fr)}
.playlist-art-tiles[data-tiles="3"] img:first-of-type {grid-row:span 2}
.playlist-art-tiles img {display:block;position:static;min-width:0;min-height:0;width:100%;height:100%;object-fit:cover}
.collection-pin {padding:8px;min-width:34px;justify-content:center}
.collection-pin[aria-pressed=true] {color:var(--accent)}
.collection-more {border:0;border-radius:50%;width:34px;height:34px;background:transparent;color:var(--text-subdued);font-size:20px;cursor:pointer}
.collection-options {position:relative}
.collection-popup {position:absolute;right:0;top:100%;z-index:5;min-width:135px;background:var(--bg-elevated);padding:4px;border:1px solid var(--border-color);border-radius:6px;box-shadow:0 4px 14px #0005}
.collection-popup button {display:block;width:100%;border:0;padding:8px 12px;text-align:left;background:transparent;color:var(--text-primary);cursor:pointer}
.collection-popup button:hover,.collection-more:hover {background:var(--bg-active)}
.pin-feedback {
    position:fixed; z-index:1000; left:16px; bottom:calc(var(--player-bar-space) + 12px);
    display:grid; grid-template-columns:minmax(0,1fr); gap:6px; max-width:min(360px,calc(100vw - 32px)); max-height:35dvh;
    overflow:auto; overscroll-behavior:contain; scrollbar-width:thin;
}
.pin-undo-notice,.pin-action-error {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:6px 8px 6px 14px; min-width:0; min-height:40px; border:1px solid var(--border-color);
    border-radius:8px; background:var(--bg-elevated); color:var(--text-primary); font-size:13px;
}
.pin-undo-notice {position:relative; padding-left:30px}
.pin-undo-notice > span {overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
.pin-undo-notice button {
    flex:none; padding:6px 10px; min-height:32px; border:0; border-radius:5px;
    background:transparent; color:var(--accent); font:inherit; font-weight:600; cursor:pointer;
}
.pin-undo-notice button:hover,.pin-undo-notice button:focus-visible {background:var(--bg-active)}
.pin-undo-notice button:disabled {opacity:.6}
.mobile-library-drawer .pin-feedback {position:static; flex:0 0 auto; max-width:100%}
.mobile-library-drawer .pin-undo-notice button {min-height:44px}
.pin-undo-notice .pin-notice-close, .mobile-library-drawer .pin-undo-notice .pin-notice-close {
    position:absolute; top:1px; left:1px; display:grid; place-items:center; width:26px; height:26px;
    min-height:0; padding:0; color:var(--text-secondary);
}
.pin-notice-close svg {width:13px; height:13px}
@media (min-width:901px) and (pointer:fine), (min-width:1025px) {
    .pin-feedback {left:calc(var(--sidebar-width) + 12px)}
}
{% include "player/playlist_filter_styles.css" %}
</style>
