<template x-if="manager.sourceTab === 'overview'">
    <section class="download-overview" role="tabpanel" id="downloads-overview" aria-labelledby="downloads-tab-overview">
        <div class="download-list-heading">
            <h3>{{ t.player_download_activity }}</h3>
            <select x-model="status" @change="visibleCount=30" aria-label="{{ t.player_status }}">
                <option value="all">{{ t.player_download_filter_all }}</option>
                <option value="active">{{ t.player_download_filter_active }}</option>
                <option value="attention">{{ t.player_download_filter_attention }}</option>
                <option value="history">{{ t.player_download_filter_history }}</option>
            </select>
        </div>
        <template x-if="manager.overviewLoading && !manager.overviewLoaded && !activity.length">
            <div class="page-skeleton" role="status"><span class="loading-label">{{ t.player_loading_content }}</span>{% include "player/skeleton_tracks.html" %}</div>
        </template>
        <template x-if="manager.overviewLoaded && !filteredActivity.length && !manager.error">
            <div class="downloads-empty">
                <svg aria-hidden="true"><use href="#download-symbol-inbox"/></svg>
                <p x-text="status === 'all' ? '{{ t.player_download_empty }}' : '{{ t.player_download_empty_filter }}'"></p>
                <button type="button" class="download-button" x-show="status === 'all'" @click="adding = true; $refs.addButton.focus()">{{ t.player_download_add }}</button>
            </div>
        </template>
        <ul class="download-activity">
            <template x-for="row in filteredActivity.slice(0, visibleCount)" :key="row.key">
                <li><button type="button" class="download-activity-row" @click="openActivity(row)">
                    <span class="download-source-icon"><svg aria-hidden="true"><use :href="'#download-symbol-' + row.source"/></svg></span>
                    <span class="download-job-title"><strong x-text="row.title" :title="row.title"></strong>
                        <small x-text="sourceLabel(row.source) + (row.date ? ' · ' + manager.formatUploadDate(row.date) : '')"></small>
                    </span>
                    <span class="download-job-status" :data-group="row.group">
                        <span x-text="row.label"></span>
                        <template x-if="row.progress !== null"><progress max="100" :value="row.progress" :aria-label="row.label"></progress></template>
                    </span>
                    <svg class="download-job-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                </button></li>
            </template>
        </ul>
        <button type="button" class="download-button download-more" x-show="filteredActivity.length > visibleCount" @click="visibleCount += 30">{{ t.player_download_more }}</button>
    </section>
</template>
